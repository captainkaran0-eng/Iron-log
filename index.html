<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Iron Log"/>

<title>Iron Log</title>

<meta name="theme-color" content="#0d0d0d"/>
<meta name="apple-mobile-web-app-title" content="Iron Log"/>

<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@400;500;600&display=swap');
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#0d0d0d;--surface:#181818;--surface2:#222222;--surface3:#2a2a2a;
  --border:#303030;--border2:#3d3d3d;
  --accent:#4a9eff;--accent-dim:rgba(74,158,255,0.12);--accent-border:rgba(74,158,255,0.3);
  --text:#e8e0d0;--text2:#c4b99a;--muted:#8a7f6e;--muted2:#5a5248;
  --up:#5dba7a;--down:#e06b6b;--same:#8a7f6e;
  --push:#e07842;--pull:#4a9eff;--legs:#a07ade;
  --safe-top:env(safe-area-inset-top,0px);--safe-bot:env(safe-area-inset-bottom,0px);
}
html,body{height:100%;overflow:hidden;}
body{background:var(--bg);color:var(--text);font-family:'Barlow',sans-serif;display:flex;flex-direction:column;padding-top:var(--safe-top);}
.app-shell{display:flex;flex-direction:column;height:100%;}

/* HEADER */
.header{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 16px 10px;flex-shrink:0;}
.header-row{display:flex;align-items:center;justify-content:space-between;}
.app-title{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:24px;color:var(--accent);text-transform:uppercase;letter-spacing:-0.5px;}
.header-right{display:flex;align-items:center;gap:8px;}
.bw-chip{background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:5px 12px;font-size:12px;color:var(--text2);cursor:pointer;font-family:'Barlow Condensed',sans-serif;font-weight:700;}
.bw-chip .bv{color:var(--accent);}
.icon-btn{width:36px;height:36px;background:var(--accent);border:none;border-radius:50%;font-size:22px;font-weight:700;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;flex-shrink:0;}

/* PAGES */
.pages-wrap{flex:1;overflow:hidden;position:relative;}
.page{position:absolute;inset:0;overflow-y:auto;display:none;-webkit-overflow-scrolling:touch;padding:14px 14px 90px;}
.page.active{display:block;}

/* BOTTOM NAV */
.bottom-nav{background:var(--surface);border-top:1px solid var(--border);display:flex;flex-shrink:0;padding-bottom:var(--safe-bot);}
.nav-btn{flex:1;padding:10px 4px 8px;background:none;border:none;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;}
.nav-btn.active{color:var(--accent);}
.nav-icon{font-size:20px;line-height:1;}

/* SESSION CARDS */
.session-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;margin-bottom:10px;overflow:hidden;position:relative;}
.delete-reveal{position:absolute;right:0;top:0;bottom:0;width:80px;background:#c0392b;display:flex;align-items:center;justify-content:center;border-radius:0 14px 14px 0;cursor:pointer;z-index:0;}
.delete-reveal span{color:#fff;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:13px;letter-spacing:1px;}
.session-card-inner{transition:transform 0.25s ease;background:var(--surface);position:relative;z-index:1;border-radius:14px;}
.session-card-header{padding:12px 14px 10px;border-bottom:1px solid var(--border);}
.session-meta{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.split-badge{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:12px;letter-spacing:1px;text-transform:uppercase;padding:3px 10px;border-radius:20px;}
.split-push{background:rgba(224,120,66,0.18);color:var(--push);}
.split-pull{background:rgba(74,158,255,0.18);color:var(--pull);}
.split-legs{background:rgba(160,122,222,0.18);color:var(--legs);}
.session-date{font-size:12px;color:var(--muted);}
.deload-tag{font-size:11px;color:var(--muted);background:var(--surface2);padding:2px 7px;border-radius:10px;}
.session-scores{display:flex;gap:14px;}
.score-block .val{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:18px;color:var(--accent);}
.score-block .lbl{font-size:10px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;}
.session-ex-list{padding:10px 14px;}
.session-ex-row{display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--border);}
.session-ex-row:last-child{border-bottom:none;}
.ex-name-text{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:15px;text-transform:uppercase;color:var(--text);flex:1;}
.ex-score-col{text-align:right;}
.ex-e1rm{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:15px;color:var(--accent);}
.ex-delta{font-size:11px;font-weight:700;font-family:'Barlow Condensed',sans-serif;}
.delta-up{color:var(--up);}.delta-down{color:var(--down);}.delta-same{color:var(--same);}
.session-notes-preview{padding:8px 14px;font-size:12px;color:var(--muted);font-style:italic;border-top:1px solid var(--border);}
.empty-state{text-align:center;padding:60px 20px;color:var(--muted);}
.empty-state .big{font-size:48px;margin-bottom:12px;}
.empty-state p{font-size:14px;line-height:1.7;color:var(--text2);}

/* DRAWER */
.drawer-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:500;display:flex;flex-direction:column;justify-content:flex-end;animation:fadeIn 0.2s ease;}
.drawer-overlay.hidden{display:none;}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.drawer{background:var(--surface);border-radius:20px 20px 0 0;max-height:92vh;display:flex;flex-direction:column;animation:slideUp 0.25s ease;padding-bottom:var(--safe-bot);}
@keyframes slideUp{from{transform:translateY(60px);opacity:0}to{transform:translateY(0);opacity:1}}
.drawer-handle{width:40px;height:4px;background:var(--border2);border-radius:2px;margin:12px auto 0;}
.drawer-header{padding:14px 16px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.drawer-title{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:22px;text-transform:uppercase;color:var(--accent);}
.drawer-close{background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer;padding:0 4px;}
.drawer-scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1;padding:14px 16px;}

/* SPLIT SELECTOR */
.split-selector{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:16px;}
.split-btn{padding:14px 8px;border-radius:12px;border:2px solid var(--border);background:var(--surface2);color:var(--muted);font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:16px;letter-spacing:1px;text-transform:uppercase;cursor:pointer;transition:all 0.15s;}
.split-btn.active-push{background:rgba(224,120,66,0.18);border-color:var(--push);color:var(--push);}
.split-btn.active-pull{background:rgba(74,158,255,0.18);border-color:var(--pull);color:var(--pull);}
.split-btn.active-legs{background:rgba(160,122,222,0.18);border-color:var(--legs);color:var(--legs);}

/* FLOW */
.flow-page{display:none;}
.flow-page.active{display:block;}
.back-btn{background:none;border:none;color:var(--text2);font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:14px;letter-spacing:1px;cursor:pointer;padding:0;text-transform:uppercase;display:flex;align-items:center;gap:4px;}

/* PICKER */
.picker-search{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:10px 14px;color:var(--text);font-size:14px;outline:none;margin-bottom:12px;font-family:'Barlow',sans-serif;}
.picker-search:focus{border-color:var(--accent);}
.picker-search::placeholder{color:var(--muted);}
.mg-section{margin-bottom:6px;}
.mg-header{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:var(--surface2);border-radius:10px;cursor:pointer;border:1px solid var(--border);}
.mg-header-name{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:14px;text-transform:uppercase;letter-spacing:0.5px;color:var(--text);}
.mg-chevron{color:var(--muted);font-size:12px;transition:transform 0.2s;}
.mg-chevron.open{transform:rotate(180deg);}
.mg-exercises{display:none;padding:4px 0 0;}
.mg-exercises.open{display:block;}
.ex-select-row{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;cursor:pointer;}
.ex-select-row:active{background:var(--surface2);}
.ex-check{width:22px;height:22px;border-radius:6px;border:2px solid var(--border2);background:var(--surface2);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.ex-check.checked{background:var(--accent);border-color:var(--accent);}
.ex-check.checked::after{content:'✓';font-size:13px;color:#fff;font-weight:700;}
.ex-select-name{font-size:14px;font-weight:500;flex:1;color:var(--text);}
.bw-tag{font-size:11px;color:var(--muted);margin-left:4px;}
.add-custom-row{display:flex;gap:8px;margin:6px 6px 4px;}
.custom-input{flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:9px 12px;color:var(--text);font-family:'Barlow',sans-serif;font-size:13px;outline:none;}
.custom-input:focus{border-color:var(--accent);}
.custom-input::placeholder{color:var(--muted);}
.add-btn-sm{background:var(--accent);border:none;border-radius:8px;padding:9px 14px;color:#fff;font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:14px;cursor:pointer;}
.sel-count-bar{background:var(--accent-dim);border:1px solid var(--accent-border);border-radius:10px;padding:10px 14px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;}
.sel-count-text{font-size:13px;color:var(--accent);font-weight:600;}
.next-btn{background:var(--accent);border:none;border-radius:10px;padding:10px 18px;color:#fff;font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:15px;letter-spacing:1px;cursor:pointer;}

/* LOGGING */
.rest-bar{display:flex;align-items:center;gap:10px;background:var(--surface2);border-radius:10px;padding:10px 14px;margin-bottom:14px;border:1px solid var(--border);}
.rest-label{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);font-weight:600;flex:1;}
.rest-display{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:22px;color:var(--text);min-width:52px;text-align:center;}
.rest-display.running{color:var(--accent);}
.rest-ctrl-btn{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:6px 12px;color:var(--text);font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:13px;cursor:pointer;}
.rest-ctrl-btn.active{border-color:var(--accent);color:var(--accent);}
.sel-ex-card{background:var(--surface2);border-radius:12px;margin-bottom:10px;overflow:hidden;border:1px solid var(--border);}
.sel-ex-head{display:flex;align-items:center;padding:10px 12px;gap:10px;border-bottom:1px solid var(--border);}
.sel-ex-name{flex:1;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:16px;text-transform:uppercase;color:var(--text);}
.sel-ex-remove{background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;padding:0 4px;}
.sets-area{padding:10px 12px 12px;}

/* SET TYPE TABS */
.set-type-tabs{display:flex;gap:6px;margin-bottom:10px;}
.set-type-tab{flex:1;padding:7px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--muted);font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:13px;letter-spacing:0.5px;cursor:pointer;text-align:center;transition:all 0.15s;}
.set-type-tab.active-working{background:rgba(74,158,255,0.15);border-color:var(--accent);color:var(--accent);}
.set-type-tab.active-top{background:rgba(93,186,122,0.15);border-color:var(--up);color:var(--up);}

.last-record-box{display:flex;justify-content:space-between;align-items:center;background:var(--accent-dim);border:1px solid var(--accent-border);border-radius:8px;padding:8px 12px;margin-bottom:10px;}
.last-rec-lbl{font-size:11px;color:var(--muted);}
.last-rec-val{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:15px;color:var(--accent);}
.pr-star{color:var(--up);font-size:11px;}
.set-hint-row{display:grid;grid-template-columns:22px 1fr 1fr 72px;gap:6px;margin-bottom:4px;}
.set-hint-row span{font-size:10px;color:var(--muted2);text-align:center;}
.set-row{display:grid;grid-template-columns:22px 1fr 1fr 72px;gap:6px;margin-bottom:6px;align-items:center;}
.set-num{font-size:12px;color:var(--muted);font-weight:600;text-align:center;}
.set-input{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:9px 6px;color:var(--text);font-size:14px;text-align:center;outline:none;font-family:'Barlow',sans-serif;-webkit-appearance:none;width:100%;}
.set-input:focus{border-color:var(--accent);}
.set-input.top-set{border-color:rgba(93,186,122,0.4);}
.set-input::placeholder{color:var(--muted2);}
.rpe-select{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:9px 4px;color:var(--text);font-size:12px;text-align:center;outline:none;font-family:'Barlow',sans-serif;-webkit-appearance:none;width:100%;}
.add-set-btn{background:none;border:1px dashed var(--border2);border-radius:8px;width:100%;padding:8px;color:var(--muted);font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:12px;letter-spacing:1px;cursor:pointer;text-transform:uppercase;margin-top:2px;}
.section-mini-label{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);font-weight:600;margin:8px 0 4px;}
.notes-area{margin-top:14px;}
.notes-lbl{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:8px;}
.notes-input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:12px;color:var(--text);font-family:'Barlow',sans-serif;font-size:14px;resize:none;outline:none;min-height:70px;line-height:1.5;}
.notes-input:focus{border-color:var(--accent);}
.notes-input::placeholder{color:var(--muted);}
.deload-row{display:flex;align-items:center;gap:10px;padding:12px 0 0;}
.deload-lbl{font-size:13px;color:var(--text2);cursor:pointer;}
.toggle-sw{position:relative;width:38px;height:22px;flex-shrink:0;}
.toggle-sw input{opacity:0;width:0;height:0;position:absolute;}
.tog-slider{position:absolute;inset:0;background:var(--surface3);border:1px solid var(--border);border-radius:11px;transition:0.2s;cursor:pointer;}
.tog-slider::before{content:'';position:absolute;width:16px;height:16px;left:2px;top:2px;background:var(--muted);border-radius:50%;transition:0.2s;}
.toggle-sw input:checked + .tog-slider{background:var(--accent);border-color:var(--accent);}
.toggle-sw input:checked + .tog-slider::before{transform:translateX(16px);background:#fff;}
.finish-btn{width:100%;padding:14px;background:var(--accent);color:#fff;border:none;border-radius:12px;font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:18px;letter-spacing:1px;text-transform:uppercase;cursor:pointer;margin-top:14px;}
.finish-btn:active{opacity:0.9;}

/* ANALYTICS */
.stats-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:16px;}
.stat-card{background:var(--surface);border-radius:12px;padding:12px;border:1px solid var(--border);text-align:center;}
.stat-val{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:22px;color:var(--accent);}
.stat-lbl{font-size:10px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-top:2px;}
.analytics-section{margin-bottom:18px;}
.analytics-title{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:8px;}
.hl-cards{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px;}
.hl-card{background:var(--surface);border-radius:12px;padding:12px;border:1px solid var(--border);}
.hl-card.best{border-color:rgba(93,186,122,0.3);}
.hl-card.worst{border-color:rgba(224,107,107,0.3);}
.hl-lbl{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;font-weight:600;margin-bottom:5px;color:var(--muted);}
.hl-ex{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:15px;text-transform:uppercase;margin-bottom:3px;}
.hl-card.best .hl-ex{color:var(--up);}
.hl-card.worst .hl-ex{color:var(--down);}
.hl-val{font-size:12px;color:var(--text2);}

/* SPLIT DRILL DOWN */
.split-card{background:var(--surface);border-radius:12px;padding:14px;margin-bottom:8px;border:1px solid var(--border);}
.split-card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;cursor:pointer;}
.split-card-title{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:20px;text-transform:uppercase;}
.split-card-count{font-size:12px;color:var(--muted);}
.mg-drill-card{background:var(--surface2);border-radius:10px;padding:12px;margin-bottom:8px;border:1px solid var(--border);cursor:pointer;}
.mg-drill-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.mg-drill-name{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:16px;text-transform:uppercase;color:var(--text);}
.mg-drill-score{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:14px;color:var(--accent);}
.bar-track{background:var(--surface3);border-radius:3px;height:5px;overflow:hidden;}
.bar-fill{height:100%;border-radius:3px;background:var(--accent);transition:width 0.5s;}
.mg-ex-list{margin-top:10px;display:none;}
.mg-ex-list.open{display:block;}
.ex-perf-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);cursor:pointer;}
.ex-perf-row:last-child{border-bottom:none;}
.ep-name{font-size:13px;font-weight:500;flex:1;color:var(--text2);}
.ep-scores{display:flex;gap:6px;align-items:center;}
.ep-e1rm{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:14px;color:var(--accent);}
.ep-delta{font-size:11px;font-weight:700;font-family:'Barlow Condensed',sans-serif;}
.ep-chevron{font-size:11px;color:var(--muted);margin-left:4px;}

/* EXERCISE DETAIL PANEL */
.ex-detail-panel{background:var(--surface3);border-radius:10px;padding:12px;margin-top:6px;display:none;}
.ex-detail-panel.open{display:block;}
.chart-title{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:6px;margin-top:10px;}
.chart-title:first-child{margin-top:0;}
.mini-chart{width:100%;height:80px;display:block;}

/* CONSISTENCY + BEST/WORST SESSION */
.session-comp-card{background:var(--surface);border-radius:12px;padding:14px;margin-bottom:8px;border:1px solid var(--border);}
.session-comp-row{display:flex;gap:10px;margin-bottom:8px;}
.session-comp-half{flex:1;background:var(--surface2);border-radius:8px;padding:10px;}
.session-comp-lbl{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:4px;}
.session-comp-date{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:15px;color:var(--text);}
.session-comp-score{font-size:12px;color:var(--accent);font-weight:600;margin-top:2px;}
.consistency-bar-wrap{margin-top:6px;}
.consistency-label-row{display:flex;justify-content:space-between;margin-bottom:4px;}
.consistency-label{font-size:12px;color:var(--text2);}
.consistency-score{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:16px;color:var(--accent);}
.week-dots{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px;}
.week-dot{width:10px;height:10px;border-radius:50%;background:var(--surface3);}
.week-dot.trained{background:var(--accent);}
.week-dot.deload{background:var(--muted);}

/* BW */
.bw-history-list{max-height:160px;overflow-y:auto;margin-top:10px;}
.bw-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;color:var(--text2);}
.bw-row:last-child{border-bottom:none;}
.bw-row strong{color:var(--text);}

/* CONFIRM */
.confirm-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:600;display:flex;align-items:center;justify-content:center;padding:20px;}
.confirm-overlay.hidden{display:none;}
.confirm-box{background:var(--surface);border-radius:16px;padding:24px 20px;max-width:300px;width:100%;border:1px solid var(--border);}
.confirm-title{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:20px;color:var(--text);margin-bottom:8px;}
.confirm-msg{font-size:14px;color:var(--text2);margin-bottom:20px;line-height:1.5;}
.confirm-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.confirm-cancel{padding:12px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:15px;cursor:pointer;}
.confirm-delete{padding:12px;background:#c0392b;border:none;border-radius:10px;color:#fff;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:15px;cursor:pointer;}

.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--accent);color:#fff;padding:10px 22px;border-radius:20px;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:15px;opacity:0;transition:all 0.3s;pointer-events:none;z-index:999;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.divider{height:1px;background:var(--border);margin:12px 0;}
::-webkit-scrollbar{width:3px;height:3px;}
::-webkit-scrollbar-track{background:var(--surface);}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}
</style>
</head>
<body>
<div class="app-shell">
  <div class="header">
    <div class="header-row">
      <div class="app-title">Iron Log</div>

</div>

<!-- NEW SESSION DRAWER -->
<div class="drawer-overlay hidden" id="newSessionDrawer">
  <div class="drawer">
    <div class="drawer-handle"></div>
    <div class="drawer-header">
      <div class="drawer-title" id="drawerTitle">New Session</div>
      <button class="drawer-close" onclick="closeNewSession()">✕</button>
    </div>
    <div class="drawer-scroll" id="drawerScroll">
      <div class="flow-page active" id="flowSplit">
        <div style="font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:10px;">Choose Split</div>
        <div class="split-selector">
          <button class="split-btn" id="splitBtnPush" onclick="selectSplit('push')">Push</button>
          <button class="split-btn" id="splitBtnPull" onclick="selectSplit('pull')">Pull</button>
          <button class="split-btn" id="splitBtnLegs" onclick="selectSplit('legs')">Legs</button>
        </div>
      </div>
      <div class="flow-page" id="flowPicker">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;">
          <button class="back-btn" onclick="goToStep('flowSplit','New Session')">← Back</button>
          <div style="flex:1;text-align:right;font-size:12px;color:var(--muted);">Tap to select</div>
        </div>
        <div id="selCountBar" class="sel-count-bar" style="display:none;">
          <span class="sel-count-text" id="selCountText">0 selected</span>
          <button class="next-btn" onclick="goToStep('flowLog','Log Session')">Log →</button>
        </div>
        <input class="picker-search" type="text" placeholder="Search exercises..." id="pickerSearch" oninput="filterExercises(this.value)"/>
        <div id="mgAccordion"></div>
      </div>
      <div class="flow-page" id="flowLog">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;">
          <button class="back-btn" onclick="goToStep('flowPicker','Select Exercises')">← Exercises</button>
          <div style="flex:1;text-align:right;">
            <button class="icon-btn" style="width:30px;height:30px;font-size:16px;background:var(--surface2);color:var(--accent);border:1px solid var(--accent-border);" onclick="goToStep('flowPicker','Select Exercises')">+</button>
          </div>
        </div>
        <div class="rest-bar">
          <div class="rest-label">Rest timer</div>
          <div class="rest-display" id="restDisplay">0:00</div>
          <button class="rest-ctrl-btn" id="restBtn" onclick="toggleRest()">Start</button>
        </div>
        <div id="sessionExList"></div>
        <div class="notes-area">
          <div class="notes-lbl">Session Notes</div>
          <textarea class="notes-input" id="sessionNotes" placeholder="PRs, energy, how it felt..."></textarea>
        </div>
        <div class="deload-row">
          <label class="toggle-sw"><input type="checkbox" id="deloadToggle"/><span class="tog-slider"></span></label>
          <span class="deload-lbl">Mark as deload</span>
        </div>
        <button class="finish-btn" onclick="finishSession()">Finish Session 💪</button>
      </div>
    </div>
  </div>
</div>

<!-- BW DRAWER -->
<div class="drawer-overlay hidden" id="bwDrawer">
  <div class="drawer">
    <div class="drawer-handle"></div>
    <div class="drawer-header">
      <div class="drawer-title">Bodyweight</div>
      <button class="drawer-close" onclick="closeBWDrawer()">✕</button>
    </div>
    <div class="drawer-scroll">
      <div style="display:flex;gap:8px;margin-bottom:10px;">
        <input class="custom-input" type="number" inputmode="decimal" id="bwInput" placeholder="Enter kg (e.g. 75.5)"/>
        <button class="add-btn-sm" onclick="logBW()">Log</button>
      </div>
      <div class="bw-history-list" id="bwHistoryList"></div>
      <button class="finish-btn" style="margin-top:12px;" onclick="closeBWDrawer()">Done</button>
    </div>
  </div>
</div>

<!-- CONFIRM DELETE -->
<div class="confirm-overlay hidden" id="confirmOverlay">
  <div class="confirm-box">
    <div class="confirm-title">Delete Session?</div>
    <div class="confirm-msg">This can't be undone. All sets and notes will be removed.</div>
    <div class="confirm-btns">
      <button class="confirm-cancel" onclick="cancelDelete()">Cancel</button>
      <button class="confirm-delete" onclick="confirmDelete()">Delete</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>

// Muscle group colors
const MG_COLORS = {
  "Chest":"#e07842","Triceps":"#e05577","Shoulders":"#c4a228",
  "Back":"#4a9eff","Biceps":"#7ab4ff","Rear Delts":"#a07ade",
  "Quads":"#a07ade","Hamstrings":"#7a5ade","Glutes":"#de7aad","Calves":"#5dba7a"
};

// ─── STATE ─────────────────────────────────────────────────────────────────
function load(k,f){try{const v=localStorage.getItem(k);return v?JSON.parse(v):f;}catch{return f;}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch{}}

let sessions = load('il3_sessions',[]);
let bwLog    = load('il3_bw',[]);
let custom   = load('il3_custom',{push:[],pull:[],legs:[]});

function persist(){save('il3_sessions',sessions);save('il3_bw',bwLog);save('il3_custom',custom);}

// Session state
let currentSplit=null, selectedExercises=[], pendingDeleteId=null;

// ─── MATH ──────────────────────────────────────────────────────────────────
function epley(w,r){if(!w||!r||+r<=0)return 0;return +w*(1+(+r)/30);}
function bestE1RM(sets){if(!sets||!sets.length)return 0;return Math.max(0,...sets.map(s=>epley(s.weight,s.reps)));}
function calcVol(sets){if(!sets)return 0;return sets.reduce((a,s)=>a+(+s.weight||0)*(+s.reps||0),0);}
function avgRPE(sets){const r=sets.filter(s=>s.rpe);return r.length?r.reduce((a,s)=>a+(+s.rpe),0)/r.length:null;}

function getLastRecord(name,excludeId){
  for(let i=sessions.length-1;i>=0;i--){
    if(sessions[i].id===excludeId)continue;
    const ex=sessions[i].exercises.find(e=>e.name===name);
    if(ex)return{e1rm:bestE1RM(ex.topSet?[ex.topSet]:ex.workingSets||[]),vol:calcVol(ex.workingSets||[]),date:sessions[i].date};
  }
  return null;
}
function getAllTimeE1RM(name){
  let best=0;
  sessions.forEach(s=>{
    const ex=s.exercises.find(e=>e.name===name);
    if(ex)best=Math.max(best,bestE1RM(ex.topSet?[ex.topSet]:ex.workingSets||[]));
  });
  return best;
}

// ─── PAGES ─────────────────────────────────────────────────────────────────
function switchPage(p){
  document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(x=>x.classList.remove('active'));
  if(p==='log'){document.getElementById('pageLog').classList.add('active');document.getElementById('navLog').classList.add('active');renderLog();}
  else{document.getElementById('pageAnalytics').classList.add('active');document.getElementById('navAnalytics').classList.add('active');renderAnalytics();}
}

// ─── LOG PAGE ───────────────────────────────────────────────────────────────
function renderLog(){
  const el=document.getElementById('logContent');
  if(!sessions.length){el.innerHTML=`<div class="empty-state"><div class="big">🏋️</div><p>No sessions yet.<br/>Tap <strong style="color:var(--accent)">+</strong> to log your first workout.</p></div>`;return;}
  el.innerHTML=[...sessions].reverse().map(s=>buildCard(s)).join('');
  initSwipe();
}

function buildCard(s){
  const topE1RMs=s.exercises.map(e=>bestE1RM(e.topSet?[e.topSet]:(e.workingSets||[])));
  const totalE1RM=topE1RMs.reduce((a,b)=>a+b,0);
  const totalVol=s.exercises.reduce((a,e)=>a+calcVol(e.workingSets||[]),0);
  const exRows=s.exercises.map(e=>{
    const e1=bestE1RM(e.topSet?[e.topSet]:(e.workingSets||[]));
    const last=getLastRecord(e.name,s.id);
    let dHtml='';
    if(last&&last.e1rm>0&&e1>0){const d=e1-last.e1rm;const cls=d>0?'delta-up':d<0?'delta-down':'delta-same';dHtml=`<span class="ex-delta ${cls}">${d>0?'+':''}${d.toFixed(1)}</span>`;}
    return `<div class="session-ex-row"><div class="ex-name-text">${e.name}</div><div class="ex-score-col">${e1>0?`<div class="ex-e1rm">${Math.round(e1)}kg</div>`:'<span style="color:var(--muted);font-size:12px;">—</span>'}${dHtml}</div></div>`;
  }).join('');
  const notesHtml=s.notes?`<div class="session-notes-preview">"${escH(s.notes)}"</div>`:'';
  const deloadTag=s.deload?'<span class="deload-tag">DELOAD</span>':'';
  return `<div class="session-card" data-id="${s.id}">
    <div class="delete-reveal" onclick="deleteSession('${s.id}')"><span>DELETE</span></div>
    <div class="session-card-inner" id="inner_${s.id}">
      <div class="session-card-header">
        <div class="session-meta"><span class="split-badge split-${s.split}">${s.split.toUpperCase()}</span><span class="session-date">${fmtDate(s.date)}</span>${deloadTag}</div>
        <div class="session-scores">
          <div class="score-block"><div class="val">${totalE1RM>0?Math.round(totalE1RM)+'kg':'—'}</div><div class="lbl">Strength</div></div>
          <div class="score-block"><div class="val">${totalVol>0?(Math.round(totalVol/100)/10)+'t':'—'}</div><div class="lbl">Volume</div></div>
          <div class="score-block"><div class="val">${s.exercises.length}</div><div class="lbl">Exercises</div></div>
        </div>
      </div>
      <div class="session-ex-list">${exRows}</div>
      ${notesHtml}
    </div>
  </div>`;
}

function initSwipe(){
  document.querySelectorAll('.session-card-inner').forEach(inner=>{
    let sx=0,cx=0,drag=false;
    inner.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;drag=true;},{passive:true});
    inner.addEventListener('touchmove',e=>{
      if(!drag)return;cx=e.touches[0].clientX;
      const dx=Math.min(0,cx-sx);
      if(dx<-5){inner.style.transform=`translateX(${Math.max(dx,-80)}px)`;e.preventDefault();}
    },{passive:false});
    inner.addEventListener('touchend',()=>{drag=false;const dx=cx-sx;if(dx<-60)inner.style.transform='translateX(-80px)';else inner.style.transform='';});
  });
}

function deleteSession(id){pendingDeleteId=id;document.getElementById('confirmOverlay').classList.remove('hidden');}
function cancelDelete(){pendingDeleteId=null;document.getElementById('confirmOverlay').classList.add('hidden');document.querySelectorAll('.session-card-inner').forEach(i=>i.style.transform='');}
function confirmDelete(){if(!pendingDeleteId)return;sessions=sessions.filter(s=>s.id!==pendingDeleteId);persist();pendingDeleteId=null;document.getElementById('confirmOverlay').classList.add('hidden');showToast('Session deleted');renderLog();}

// ─── NEW SESSION ────────────────────────────────────────────────────────────
function openNewSession(){
  currentSplit=null;selectedExercises=[];
  document.querySelectorAll('.split-btn').forEach(b=>b.className='split-btn');
  document.getElementById('sessionNotes').value='';
  document.getElementById('deloadToggle').checked=false;
  stopRest();goToStep('flowSplit','New Session');
  document.getElementById('newSessionDrawer').classList.remove('hidden');
}
function closeNewSession(){document.getElementById('newSessionDrawer').classList.add('hidden');stopRest();}

function goToStep(id,title){
  document.querySelectorAll('.flow-page').forEach(p=>p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.getElementById('drawerTitle').textContent=title;
  document.getElementById('drawerScroll').scrollTop=0;
  if(id==='flowLog')renderSessionExList();
}

function selectSplit(split){
  currentSplit=split;
  document.querySelectorAll('.split-btn').forEach(b=>b.className='split-btn');
  document.getElementById('splitBtn'+cap(split)).className=`split-btn active-${split}`;
  renderPicker(split);
  goToStep('flowPicker','Select Exercises');
}

// ─── PICKER ─────────────────────────────────────────────────────────────────
function getDBForSplit(split){
  const base=[...EX_DB[split]];
  (custom[split]||[]).forEach(ex=>{if(!base.find(e=>e.name===ex.name))base.push(ex);});
  return base;
}

function getMGGroups(split){
  const db=getDBForSplit(split);
  const groups={};
  db.forEach(ex=>{
    if(!groups[ex.p])groups[ex.p]=[];
    groups[ex.p].push(ex);
  });
  return groups;
}

function renderPicker(split){
  const groups=getMGGroups(split);
  const html=Object.keys(groups).map(mg=>{
    const exHtml=groups[mg].map(ex=>buildExRow(ex)).join('');
    return `<div class="mg-section">
      <div class="mg-header" onclick="toggleMG('mg_${eid(mg)}')">
        <div class="mg-header-name">${mg}</div>
        <div class="mg-chevron" id="chv_${eid(mg)}">▼</div>
      </div>
      <div class="mg-exercises" id="mg_${eid(mg)}">${exHtml}
        <div class="add-custom-row">
          <input class="custom-input" placeholder="Add exercise..." id="ci_${eid(mg)}"/>
          <button class="add-btn-sm" onclick="addCustom('${esc(split)}','${esc(mg)}')">+</button>
        </div>
      </div>
    </div>`;
  }).join('');
  document.getElementById('mgAccordion').innerHTML=html;
  updateSelCount();
}

function buildExRow(ex){
  const checked=selectedExercises.find(e=>e.name===ex.name);
  return `<div class="ex-select-row" onclick="toggleEx('${esc(ex.name)}')">
    <div class="ex-check ${checked?'checked':''}" id="chk_${eid(ex.name)}"></div>
    <div class="ex-select-name">${ex.name}${ex.bw?'<span class="bw-tag">(BW)</span>':''}${ex.s?`<span class="bw-tag">+${ex.s}</span>`:''}</div>
  </div>`;
}

function filterExercises(q){
  if(!currentSplit)return;
  const db=getDBForSplit(currentSplit);
  q=q.toLowerCase();
  const filtered=db.filter(ex=>ex.name.toLowerCase().includes(q));
  if(!q){renderPicker(currentSplit);return;}
  document.getElementById('mgAccordion').innerHTML=filtered.map(ex=>`
    <div class="ex-select-row" onclick="toggleEx('${esc(ex.name)}')">
      <div class="ex-check ${selectedExercises.find(e=>e.name===ex.name)?'checked':''}" id="chk_${eid(ex.name)}"></div>
      <div class="ex-select-name">${ex.name}${ex.bw?'<span class="bw-tag">(BW)</span>':''}</div>
    </div>`).join('');
}

function toggleMG(id){
  const el=document.getElementById(id);const chv=document.getElementById('chv_'+id.replace('mg_',''));
  el.classList.toggle('open');if(chv)chv.classList.toggle('open');
}

function findExDef(name){
  for(const split of['push','pull','legs']){const f=EX_DB[split].find(e=>e.name===name);if(f)return f;}
  for(const split of['push','pull','legs']){const f=(custom[split]||[]).find(e=>e.name===name);if(f)return f;}
  return null;
}

function toggleEx(name){
  const idx=selectedExercises.findIndex(e=>e.name===name);
  if(idx>=0){selectedExercises.splice(idx,1);}
  else{
    const def=findExDef(name)||{name,p:'Other'};
    selectedExercises.push({name,p:def.p,s:def.s||null,bw:def.bw||false,workingSets:[{weight:'',reps:'',rpe:''}],topSet:{weight:'',reps:'',rpe:''}});
  }
  const chk=document.getElementById('chk_'+eid(name));
  if(chk)chk.className='ex-check'+(selectedExercises.find(e=>e.name===name)?' checked':'');
  updateSelCount();
}

function addCustom(split,mg){
  const input=document.getElementById('ci_'+eid(mg));
  const name=input.value.trim();
  if(!name)return;
  if(!custom[split])custom[split]=[];
  if(!custom[split].find(e=>e.name===name)){custom[split].push({name,p:mg});persist();}
  input.value='';renderPicker(split);showToast('Added!');
}

function updateSelCount(){
  const bar=document.getElementById('selCountBar');
  const txt=document.getElementById('selCountText');
  if(selectedExercises.length>0){bar.style.display='flex';txt.textContent=`${selectedExercises.length} exercise${selectedExercises.length>1?'s':''} selected`;}
  else bar.style.display='none';
}

// ─── SESSION LOGGING ────────────────────────────────────────────────────────

      <div class="set-row">
        <div class="set-num">${si+1}</div>
        <input class="set-input" type="number" inputmode="decimal" placeholder="${ex.bw&&bw?bw:'kg'}" value="${s.weight}" onchange="updWorking(${ei},${si},'weight',this.value)"/>
        <input class="set-input" type="number" inputmode="numeric" placeholder="reps" value="${s.reps}" onchange="updWorking(${ei},${si},'reps',this.value)"/>
        <select class="rpe-select" onchange="updWorking(${ei},${si},'rpe',this.value)">

        </select>
      </div>`).join('');
    // Top set
    const ts=ex.topSet;
    const topHtml=`
      <div class="set-row">
        <div class="set-num" style="color:var(--up);">★</div>
        <input class="set-input top-set" type="number" inputmode="decimal" placeholder="${ex.bw&&bw?bw:'kg'}" value="${ts.weight}" onchange="updTop(${ei},'weight',this.value)"/>
        <input class="set-input top-set" type="number" inputmode="numeric" placeholder="reps" value="${ts.reps}" onchange="updTop(${ei},'reps',this.value)"/>
        <select class="rpe-select" onchange="updTop(${ei},'rpe',this.value)">
          <option value="">RPE</option>
          ${[6,6.5,7,7.5,8,8.5,9,9.5,10].map(r=>`<option value="${r}" ${ts.rpe==r?'selected':''}>${r}</option>`).join('')}
        </select>
      </div>`;
    return `<div class="sel-ex-card">
      <div class="sel-ex-head">

        <button class="sel-ex-remove" onclick="removeEx(${ei})">✕</button>
      </div>
      <div class="sets-area">
        ${lastHtml}
        <div class="section-mini-label">Working Sets</div>
        <div class="set-hint-row"><span></span><span>weight</span><span>reps</span><span>RPE</span></div>
        ${wSetsHtml}
        <button class="add-set-btn" onclick="addWSet(${ei})">+ Working Set</button>
        <div class="divider"></div>
        <div class="section-mini-label" style="color:var(--up);">★ Top Set</div>

function updWorking(ei,si,field,val){selectedExercises[ei].workingSets[si][field]=val;}
function updTop(ei,field,val){selectedExercises[ei].topSet[field]=val;}
function addWSet(ei){selectedExercises[ei].workingSets.push({weight:'',reps:'',rpe:''});renderSessionExList();}
function removeEx(ei){
  const name=selectedExercises[ei].name;
  selectedExercises.splice(ei,1);
  const chk=document.getElementById('chk_'+eid(name));
  if(chk)chk.className='ex-check';
  updateSelCount();renderSessionExList();
}

function finishSession(){
  if(!currentSplit){showToast('Pick a split first');return;}
  if(!selectedExercises.length){showToast('Add exercises first');return;}
  const session={
    id:Date.now().toString(),
    date:new Date().toISOString(),
    split:currentSplit,
    exercises:selectedExercises.map(e=>({
      name:e.name,p:e.p,s:e.s||null,bw:e.bw||false,
      workingSets:e.workingSets.filter(s=>s.weight||s.reps),
      topSet:e.topSet
    })),
    notes:document.getElementById('sessionNotes').value.trim(),
    deload:document.getElementById('deloadToggle').checked
  };
  sessions.push(session);persist();
  closeNewSession();showToast('Session saved! 💪');renderLog();
}

// ─── REST TIMER ─────────────────────────────────────────────────────────────
let restInterval=null,restStart=null,restRunning=false;
function toggleRest(){restRunning?stopRest():startRest();}
function startRest(){
  restRunning=true;restStart=Date.now();
  document.getElementById('restBtn').textContent='Stop';
  document.getElementById('restBtn').className='rest-ctrl-btn active';
  restInterval=setInterval(tickRest,1000);tickRest();
}
function stopRest(){
  restRunning=false;clearInterval(restInterval);
  const d=document.getElementById('restDisplay'),b=document.getElementById('restBtn');
  if(d){d.textContent='0:00';d.className='rest-display';}
  if(b){b.textContent='Start';b.className='rest-ctrl-btn';}
}
function tickRest(){
  const s=Math.floor((Date.now()-restStart)/1000),m=Math.floor(s/60),sec=s%60;
  const d=document.getElementById('restDisplay');
  if(d){d.textContent=`${m}:${sec.toString().padStart(2,'0')}`;d.className='rest-display running';}
}

function openBWDrawer(){renderBWHistory();document.getElementById('bwDrawer').classList.remove('hidden');}

// ─── ANALYTICS ──────────────────────────────────────────────────────────────
function renderAnalytics(){
  const el=document.getElementById('analyticsContent');
  if(sessions.length<2){el.innerHTML=`<div class="empty-state"><div class="big">📊</div><p>Log at least 2 sessions<br/>to see analytics.</p></div>`;return;}

  const active=sessions.filter(s=>!s.deload);
  const streak=calcStreak();
  const bw=getCurrentBW();

  // Build per-exercise history (both top set and working sets)
  // An exercise can appear in 2 MGs (primary + secondary)
  const exHistory={}; // name -> [{date,e1rm,vol,rpeTop,split,p,s}]
  active.forEach(s=>{
    s.exercises.forEach(e=>{
      if(!exHistory[e.name])exHistory[e.name]=[];
      const ts=e.topSet?e.topSet:{};
      exHistory[e.name].push({
        date:s.date,
        e1rm:bestE1RM(ts.weight?[ts]:(e.workingSets||[])),
        vol:calcVol(e.workingSets||[]),
        rpe:ts.rpe?+ts.rpe:avgRPE(e.workingSets||[]),
        split:s.split,p:e.p,s:e.s||null
      });
    });
  });

  // Best/worst improved
  let bestEx=null,worstEx=null,bestPct=-Infinity,worstPct=Infinity;
  Object.keys(exHistory).forEach(name=>{
    const arr=exHistory[name];if(arr.length<2)return;
    const first=arr[0].e1rm,last=arr[arr.length-1].e1rm;
    if(!first||!last)return;
    const pct=((last-first)/first)*100;
    if(pct>bestPct){bestPct=pct;bestEx={name,pct,first,last};}
    if(pct<worstPct){worstPct=pct;worstEx={name,pct,first,last};}
  });

  const hlHtml=(bestEx||worstEx)?`<div class="analytics-section">
    <div class="analytics-title">Highlights</div>
    <div class="hl-cards">
      ${bestEx?`<div class="hl-card best"><div class="hl-lbl">Most improved</div><div class="hl-ex">${bestEx.name}</div><div class="hl-val">+${bestPct.toFixed(1)}% strength</div></div>`:''}
      ${worstEx?`<div class="hl-card worst"><div class="hl-lbl">Needs attention</div><div class="hl-ex">${worstEx.name}</div><div class="hl-val">${worstPct.toFixed(1)}% strength</div></div>`:''}
    </div>
  </div>`:'' ;

  // Consistency
  const consistencyHtml=buildConsistencySection(active);

  // Best/Worst session per split
  const bwsHtml=buildBestWorstSessions(active);

  // Split drill-down
  const splitHtml=['push','pull','legs'].map(split=>buildSplitSection(split,active,exHistory)).join('');

  el.innerHTML=`
    <div class="stats-row">
      <div class="stat-card"><div class="stat-val">${streak}</div><div class="stat-lbl">Streak</div></div>
      <div class="stat-card"><div class="stat-val">${active.length}</div><div class="stat-lbl">Sessions</div></div>
      <div class="stat-card"><div class="stat-val">${bw?bw+'kg':'—'}</div><div class="stat-lbl">Bodyweight</div></div>
    </div>
    ${hlHtml}
    ${consistencyHtml}
    ${bwsHtml}
    ${splitHtml}`;
}

function buildConsistencySection(active){
  if(active.length<2)return'';
  const splits=['push','pull','legs'];
  const rows=splits.map(split=>{
    const ss=active.filter(s=>s.split===split);
    if(ss.length<2)return'';
    // avg days between sessions
    const dates=ss.map(s=>new Date(s.date)).sort((a,b)=>a-b);
    let gaps=[];for(let i=1;i<dates.length;i++)gaps.push((dates[i]-dates[i-1])/(1000*60*60*24));
    const avgGap=gaps.length?gaps.reduce((a,b)=>a+b,0)/gaps.length:0;
    const score=Math.max(0,Math.min(100,Math.round(100-(Math.abs(avgGap-5)*8))));
    const color=score>=75?'var(--up)':score>=50?'var(--accent)':'var(--down)';
    return `<div style="margin-bottom:10px;">
      <div class="consistency-label-row">
        <span class="consistency-label">${cap(split)} — avg ${avgGap.toFixed(1)}d between sessions</span>
        <span class="consistency-score" style="color:${color}">${score}/100</span>
      </div>
      <div class="bar-track"><div class="bar-fill" style="width:${score}%;background:${color}"></div></div>
    </div>`;
  }).join('');
  if(!rows.replace(/\s/g,''))return'';
  return `<div class="analytics-section">
    <div class="analytics-title">Consistency Score</div>
    <div class="session-comp-card">${rows}</div>
  </div>`;
}

function buildBestWorstSessions(active){
  const splits=['push','pull','legs'];
  const html=splits.map(split=>{
    const ss=active.filter(s=>s.split===split);
    if(ss.length<2)return'';
    const scored=ss.map(s=>({...s,score:s.exercises.reduce((a,e)=>a+bestE1RM(e.topSet?[e.topSet]:(e.workingSets||[])),0)}));
    scored.sort((a,b)=>b.score-a.score);
    const best=scored[0],worst=scored[scored.length-1];
    const color={push:'var(--push)',pull:'var(--pull)',legs:'var(--legs)'}[split];
    return `<div style="margin-bottom:10px;">
      <div style="font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:14px;text-transform:uppercase;color:${color};margin-bottom:6px;">${split}</div>
      <div class="session-comp-row">
        <div class="session-comp-half"><div class="session-comp-lbl">Best Session</div><div class="session-comp-date">${fmtDate(best.date)}</div><div class="session-comp-score">${Math.round(best.score)}kg score</div></div>
        <div class="session-comp-half"><div class="session-comp-lbl">Worst Session</div><div class="session-comp-date">${fmtDate(worst.date)}</div><div class="session-comp-score" style="color:var(--down)">${Math.round(worst.score)}kg score</div></div>
      </div>
    </div>`;
  }).join('');
  if(!html.replace(/\s/g,''))return'';
  return `<div class="analytics-section"><div class="analytics-title">Best vs Worst Session</div><div class="session-comp-card">${html}</div></div>`;
}

function buildSplitSection(split,active,exHistory){
  const ss=active.filter(s=>s.split===split);
  if(!ss.length)return'';

  // Primary MG only for analytics — secondary skews data (e.g. bench should not count for Triceps)
  const mgMap={}; // mg -> {exNames:[]}
  ss.forEach(s=>s.exercises.forEach(e=>{
    const mg=e.p;
    if(!mgMap[mg])mgMap[mg]={exNames:new Set()};
    mgMap[mg].exNames.add(e.name);
  }));

  // Per MG avg e1RM (from top set)
  Object.keys(mgMap).forEach(mg=>{
    const scores=[];
    mgMap[mg].exNames.forEach(name=>{
      const hist=exHistory[name];
      if(hist&&hist.length){
        const latest=hist[hist.length-1];
        if(latest.e1rm>0)scores.push(latest.e1rm);
      }
    });
    mgMap[mg].avgE1RM=scores.length?scores.reduce((a,b)=>a+b,0)/scores.length:0;
    mgMap[mg].exNames=[...mgMap[mg].exNames];
  });

  const maxAvg=Math.max(...Object.values(mgMap).map(m=>m.avgE1RM),1);
  const color={push:'var(--push)',pull:'var(--pull)',legs:'var(--legs)'}[split];

  const mgCards=Object.keys(mgMap).map(mg=>{
    const mgData=mgMap[mg];
    const pct=(mgData.avgE1RM/maxAvg)*100;
    const mgColor=MG_COLORS[mg]||'var(--accent)';
    const exRows=mgData.exNames.map(name=>{
      const hist=exHistory[name]||[];
      if(!hist.length)return'';
      const latest=hist[hist.length-1];
      let dHtml='';
      if(hist.length>=2){
        const prev=hist[hist.length-2];
        const d=latest.e1rm-prev.e1rm;
        const vd=latest.vol-prev.vol;
        const cls=d>0?'delta-up':d<0?'delta-down':'delta-same';
        const vcls=vd>0?'delta-up':vd<0?'delta-down':'delta-same';
        dHtml=`<span class="ep-delta ${cls}">${d>0?'+':''}${d.toFixed(0)}kg</span><span class="ep-delta ${vcls}" style="font-size:10px;"> vol${vd>0?'+':''}${(Math.round(vd/100)/10)}t</span>`;
      }
      const panelId=`exdetail_${eid(mg)}_${eid(name)}`;
      return `<div class="ex-perf-row" onclick="toggleExDetail('${panelId}','${esc(name)}')">
        <div class="ep-name">${name}</div>
        <div class="ep-scores">
          <span class="ep-e1rm">${latest.e1rm>0?Math.round(latest.e1rm)+'kg':'—'}</span>
          ${dHtml}
          <span class="ep-chevron">▼</span>
        </div>
      </div>
      <div class="ex-detail-panel" id="${panelId}"></div>`;
    }).join('');
    const listId=`mglist_${eid(split)}_${eid(mg)}`;
    return `<div class="mg-drill-card" onclick="toggleMGDrill('${listId}')">
      <div class="mg-drill-header">
        <div class="mg-drill-name" style="color:${mgColor}">${mg}</div>
        <div class="mg-drill-score">${mgData.avgE1RM>0?Math.round(mgData.avgE1RM)+'kg avg':'—'}</div>
      </div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${mgColor}"></div></div>
      <div class="mg-ex-list" id="${listId}">${exRows}</div>
    </div>`;
  }).join('');

  return `<div class="analytics-section">
    <div class="analytics-title">${split.toUpperCase()} Split</div>
    <div class="split-card">
      <div class="split-card-header">
        <div class="split-card-title" style="color:${color}">${split.toUpperCase()}</div>
        <div class="split-card-count">${ss.length} session${ss.length>1?'s':''}</div>
      </div>
      ${mgCards}
    </div>
  </div>`;
}

function toggleMGDrill(id){
  const el=document.getElementById(id);
  if(el)el.classList.toggle('open');
}

function toggleExDetail(panelId,name){
  const panel=document.getElementById(panelId);
  if(!panel)return;
  if(panel.classList.contains('open')){panel.classList.remove('open');return;}
  // Build charts
  const hist=buildExHistory(name);
  if(!hist.length){panel.innerHTML='<div style="font-size:12px;color:var(--muted);padding:8px 0;">Not enough data yet.</div>';panel.classList.add('open');return;}
  panel.innerHTML=buildExCharts(name,hist);
  panel.classList.add('open');
  // Draw SVG charts after DOM insert
  setTimeout(()=>drawCharts(name,hist),50);
}

function buildExHistory(name){
  const result=[];
  sessions.filter(s=>!s.deload).forEach(s=>{
    const ex=s.exercises.find(e=>e.name===name);
    if(!ex)return;
    const ts=ex.topSet||{};
    result.push({
      date:s.date,
      e1rm:bestE1RM(ts.weight?[ts]:(ex.workingSets||[])),
      vol:calcVol(ex.workingSets||[]),
      rpe:ts.rpe?+ts.rpe:avgRPE(ex.workingSets||[]),
      topWeight:+ts.weight||0,
      topReps:+ts.reps||0
    });
  });
  return result;
}

function buildExCharts(name,hist){
  const sid=eid(name);
  return `<div class="chart-title">Strength Score (e1RM)</div>
    <svg class="mini-chart" id="chart_e1rm_${sid}" viewBox="0 0 280 80" style="width:100%;height:80px;display:block;"></svg>
    <div class="chart-title">Volume (working sets)</div>
    <svg class="mini-chart" id="chart_vol_${sid}" viewBox="0 0 280 80" style="width:100%;height:80px;display:block;"></svg>
    <div class="chart-title" style="color:var(--up)">RPE Trend (top set)</div>
    <svg class="mini-chart" id="chart_rpe_${sid}" viewBox="0 0 280 80" style="width:100%;height:80px;display:block;"></svg>
    <div class="chart-title" style="color:var(--push)">Fatigue Index (e1RM / RPE)</div>
    <div id="chart_fatigue_${sid}" style="padding:4px 0;"></div>
    <div style="font-size:11px;color:var(--muted);text-align:center;margin-top:6px;">${hist.length} session${hist.length>1?'s':''} tracked</div>`;
}

function drawCharts(name,hist){
  const sid=eid(name);
  drawLineChart(`chart_e1rm_${sid}`,hist.map(h=>h.e1rm),'var(--accent)',hist.map(h=>fmtDateShort(h.date)),false);
  drawLineChart(`chart_vol_${sid}`,hist.map(h=>h.vol),'var(--pull)',hist.map(h=>fmtDateShort(h.date)),false);
  const rpeData=hist.map(h=>h.rpe);
  if(rpeData.some(r=>r!=null)){
    drawLineChart(`chart_rpe_${sid}`,rpeData,'var(--up)',hist.map(h=>fmtDateShort(h.date)),true);
  } else {
    const el=document.getElementById(`chart_rpe_${sid}`);
    if(el)el.outerHTML=`<div style="font-size:11px;color:var(--muted);padding:4px 0;margin-bottom:8px;">Log RPE on top sets to see this trend</div>`;
  }
  drawFatigueIndex(`chart_fatigue_${sid}`,hist);
}

function drawFatigueIndex(divId,hist){
  const el=document.getElementById(divId);
  if(!el)return;
  const valid=hist.filter(h=>h.e1rm>0&&h.rpe!=null);
  if(valid.length<2){el.innerHTML=`<div style="font-size:11px;color:var(--muted);padding:4px 0;">Need 2+ sessions with RPE logged on top set</div>`;return;}
  const rows=valid.map(h=>({date:h.date,fi:+(h.e1rm/h.rpe).toFixed(1),e1rm:h.e1rm,rpe:h.rpe}));
  const trend=rows[rows.length-1].fi - rows[0].fi;
  const trendColor=trend>0?'var(--up)':trend<0?'var(--down)':'var(--same)';
  const trendLabel=trend>0?'↑ More output per effort':'↓ More effort for same output';
  const rowsHtml=rows.map(r=>`
    <div style="display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid var(--border);font-size:12px;">
      <span style="color:var(--muted);min-width:54px;">${fmtDateShort(r.date)}</span>
      <span style="color:var(--text2)">${Math.round(r.e1rm)}kg</span>
      <span style="color:var(--muted)">RPE ${r.rpe}</span>
      <span style="font-family:'Barlow Condensed',sans-serif;font-weight:700;color:var(--accent)">${r.fi}</span>
    </div>`).join('');
  el.innerHTML=`
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
      <span style="font-size:11px;color:var(--muted);">e1RM ÷ RPE · higher = better</span>
      <span style="font-size:12px;font-weight:700;color:${trendColor}">${trendLabel}</span>
    </div>
    ${rowsHtml}`;
}

function drawLineChart(svgId,data,color,labels,isRPE){
  const svg=document.getElementById(svgId);
  if(!svg)return;
  const filtered=data.map((v,i)=>({v,i})).filter(x=>x.v!=null&&x.v>0);
  if(filtered.length<2){svg.innerHTML=`<text x="50%" y="50%" text-anchor="middle" fill="#5a5248" font-size="11" font-family="Barlow,sans-serif">Not enough data</text>`;return;}
  const W=280,H=80;
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  const vals=filtered.map(x=>x.v);
  const mn=Math.min(...vals),mx=Math.max(...vals);
  const range=mx-mn||1;
  const pad={l:8,r:8,t:10,b:20};
  const cw=W-pad.l-pad.r,ch=H-pad.t-pad.b;
  const px=x=>(pad.l+(x/(data.length-1||1))*cw);
  const py=v=>(pad.t+ch-(((v-mn)/range)*ch));
  // Area
  let aPath=`M${px(filtered[0].i)},${H-pad.b}`;
  filtered.forEach(x=>aPath+=` L${px(x.i)},${py(x.v)}`);
  aPath+=` L${px(filtered[filtered.length-1].i)},${H-pad.b} Z`;
  // Line
  let lPath=`M${px(filtered[0].i)},${py(filtered[0].v)}`;
  filtered.slice(1).forEach(x=>lPath+=` L${px(x.i)},${py(x.v)}`);
  // Labels (first, last, max)
  const labelPoints=[filtered[0],filtered[filtered.length-1]];
  if(mx!==filtered[0].v&&mx!==filtered[filtered.length-1].v){const maxPt=filtered.find(x=>x.v===mx);if(maxPt)labelPoints.push(maxPt);}
  const labelHtml=labelPoints.map(x=>{
    const textX=Math.max(20,Math.min(W-20,px(x.i)));
    const textY=py(x.v)-4<14?py(x.v)+14:py(x.v)-4;
    return `<text x="${textX}" y="${textY}" text-anchor="middle" fill="${color}" font-size="9" font-family="Barlow Condensed,sans-serif" font-weight="700">${isRPE?x.v.toFixed(1):Math.round(x.v)}</text>`;
  }).join('');
  // Date labels
  const dateHtml=[filtered[0],filtered[filtered.length-1]].map((x,i)=>{
    const anchor=i===0?'start':'end';
    const textX=i===0?pad.l:W-pad.r;
    return `<text x="${textX}" y="${H-4}" text-anchor="${anchor}" fill="#5a5248" font-size="9" font-family="Barlow,sans-serif">${labels[x.i]||''}</text>`;
  }).join('');
  svg.innerHTML=`
    <defs><linearGradient id="g_${svgId}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${color}" stop-opacity="0.25"/><stop offset="100%" stop-color="${color}" stop-opacity="0.02"/></linearGradient></defs>
    <path d="${aPath}" fill="url(#g_${svgId})"/>
    <path d="${lPath}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    ${filtered.map(x=>`<circle cx="${px(x.i)}" cy="${py(x.v)}" r="2.5" fill="${color}"/>`).join('')}
    ${labelHtml}${dateHtml}`;
}

// ─── UTILS ──────────────────────────────────────────────────────────────────
function calcStreak(){
  if(!sessions.length)return 0;
  const dates=[...new Set(sessions.map(s=>new Date(s.date).toDateString()))].sort((a,b)=>new Date(b)-new Date(a));
  let streak=0,check=new Date();check.setHours(0,0,0,0);
  for(const d of dates){const sd=new Date(d);if(Math.round((check-sd)/86400000)<=1){streak++;check=sd;}else break;}
  return streak;
}
function fmtDate(iso){return new Date(iso).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});}
function fmtDateShort(iso){return new Date(iso).toLocaleDateString('en-IN',{day:'numeric',month:'short'});}
function esc(s){return(s||'').replace(/'/g,"\\'").replace(/"/g,'&quot;');}
function eid(s){return(s||'').replace(/[^a-zA-Z0-9]/g,'_');}
function escH(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1);}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200);}

// Close overlays on bg tap
['newSessionDrawer','bwDrawer'].forEach(id=>{
  document.getElementById(id).addEventListener('click',function(e){if(e.target===this)this.classList.add('hidden');});
});

// Init
const latestBW=getCurrentBW();
if(latestBW)document.getElementById('bwDisplay').textContent=latestBW+'kg';
renderLog();
</script>

<script>
if('serviceWorker' in navigator){
  const swCode = `
    const CACHE='ironlog-v3';
    self.addEventListener('install', e => {
      self.skipWaiting();
    });
    self.addEventListener('activate', e => {
      e.waitUntil(clients.claim());
    });
    self.addEventListener('fetch', e => {
      e.respondWith(
        caches.open(CACHE).then(cache =>
          cache.match(e.request).then(cached => {
            const fresh = fetch(e.request).then(resp => {
              cache.put(e.request, resp.clone());
              return resp;
            }).catch(() => cached);
            return cached || fresh;
          })
        )
      );
    });
  `;
  const blob = new Blob([swCode], {type:'application/javascript'});
  const swUrl = URL.createObjectURL(blob);
  navigator.serviceWorker.register(swUrl).catch(()=>{});
}
</script>
